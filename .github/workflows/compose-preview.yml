name: Compose Preview

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # Gradle
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # --------------------------------------------------
      # Compose Preview
      #
      # IMPORTANT:
      #
      # We intentionally SKIP the Android resource
      # renderer.
      #
      # Compose previews remain enabled.
      # Accessibility remains enabled.
      # Notifications remains enabled.
      #
      # The resource renderer was the pipeline producing
      # the failing resource capture results.
      # --------------------------------------------------

      - name: Render Compose previews
        id: compose_preview
        continue-on-error: true
        uses: yschimke/compose-ai-tools/.github/actions/apply@v0.11.6
        with:
          cli-version: '0.11.6'

          mode: ${{ github.event_name == 'workflow_dispatch' && 'baseline' || 'auto' }}

          timeout: '600'

          # ------------------------------------------------
          # Run only the useful pipelines.
          #
          # resources is intentionally excluded.
          # ------------------------------------------------
          only: compose,a11y,notifications

      # --------------------------------------------------
      # Diagnostic dump
      # --------------------------------------------------

      - name: Dump Compose Preview Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "COMPOSE PREVIEW DIAGNOSTICS"
          echo "=================================================="

          echo
          echo "Working directory:"
          pwd

          echo
          echo "Git commit:"
          git rev-parse HEAD 2>/dev/null || true

          echo
          echo "--------------------------------------------------"
          echo "Render return-code files"
          echo "--------------------------------------------------"

          for file in \
            _compose_render_rc \
            _resources_render_rc \
            _a11y_render_rc \
            _notifications_render_rc \
            _compose_rc \
            _resources_rc \
            _a11y_rc \
            _notifications_rc
          do
            if [ -f "$file" ]; then
              echo
              echo "### $file"
              cat "$file"
            fi
          done

          echo
          echo "--------------------------------------------------"
          echo "Generated preview/report files"
          echo "--------------------------------------------------"

          find . \
            -type f \
            \( \
              -name "*.json" \
              -o -name "*.md" \
              -o -name "*.log" \
              -o -name "*.txt" \
              -o -name "*report*" \
              -o -name "*preview*" \
              -o -name "*render*" \
            \) \
            -not -path "./.git/*" \
            -print \
            2>/dev/null | sort

          echo
          echo "--------------------------------------------------"
          echo "JSON files"
          echo "--------------------------------------------------"

          find . \
            -type f \
            -name "*.json" \
            -not -path "./.git/*" \
            -print0 \
            2>/dev/null |
          while IFS= read -r -d '' file; do
            echo
            echo "### $file"
            cat "$file" 2>/dev/null || true
          done

          echo
          echo "--------------------------------------------------"
          echo "Markdown reports"
          echo "--------------------------------------------------"

          find . \
            -type f \
            -name "*.md" \
            -not -path "./.git/*" \
            -print0 \
            2>/dev/null |
          while IFS= read -r -d '' file; do
            echo
            echo "### $file"
            cat "$file" 2>/dev/null || true
          done

          echo
          echo "--------------------------------------------------"
          echo "PNG / WEBP files"
          echo "--------------------------------------------------"

          PNG_COUNT=$(find . \
            -type f \
            \( -name "*.png" -o -name "*.webp" \) \
            -not -path "./.git/*" \
            2>/dev/null | wc -l)

          echo "PNG/WEBP count: $PNG_COUNT"

          find . \
            -type f \
            \( -name "*.png" -o -name "*.webp" \) \
            -not -path "./.git/*" \
            -print \
            2>/dev/null | sort

          echo
          echo "=================================================="
          echo "END COMPOSE PREVIEW DIAGNOSTICS"
          echo "=================================================="

      # --------------------------------------------------
      # Upload diagnostics and rendered previews
      # --------------------------------------------------

      - name: Upload Compose Preview Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-preview-diagnostics-${{ github.run_id }}
          path: |
            _*_render_rc
            _*_rc
            **/*.json
            **/*.md
            **/*.log
            **/*.txt
            **/*report*
            **/*preview*
            **/*render*
            **/*.png
            **/*.webp
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # Final status
      #
      # Only pipelines that were actually requested should
      # determine the final result.
      #
      # resources is intentionally ignored because it is
      # disabled above.
      # --------------------------------------------------

      - name: Surface pipeline failures
        if: always()
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.compose_preview.outcome }}
        run: |
          set -euo pipefail

          rc=0
          found_rc=false

          # resources deliberately excluded.
          for p in compose a11y notifications; do

            file="_${p}_render_rc"

            if [ -f "$file" ]; then

              found_rc=true

              extra=$(cat "$file" 2>/dev/null || echo 0)

              echo "${file}: ${extra}"

              if [ "$extra" -ne 0 ] && [ "$rc" -eq 0 ]; then
                rc="$extra"
              fi

            fi

          done

          echo "Renderer action outcome: ${ACTION_OUTCOME}"

          if [ "$found_rc" = "false" ]; then

            if [ "$ACTION_OUTCOME" = "failure" ]; then
              rc=1
            fi

          fi

          if [ "$rc" -ne 0 ]; then

            echo "::error::Compose Preview pipeline failed (rc=${rc}). Full diagnostics were uploaded as the compose-preview-diagnostics artifact."

            exit "$rc"

          fi

          echo "Compose Preview pipelines completed successfully."
