# Gradle Wrapper Properties Configuration
# 
# This file dictates which exact version of Gradle is downloaded and executed by the 
# `./gradlew` script. It ensures that all developer machines and GitHub Actions CI runners 
# build the app using the exact same Gradle toolchain environment.

# Base location where the downloaded Gradle distribution zip archive will be unpacked
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Download URL for the required Gradle binary distribution.
# Gradle 8.11 is specified here for full compatibility with JDK 21 and Android Gradle Plugin 8.x.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11-bin.zip

# Base location where the downloaded .zip files are cached on disk
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# Network timeout in milliseconds when downloading the Gradle distribution zip archive
networkTimeout=10000

# Validates that the downloaded distribution URL matches official checksums before executing
validateDistributionUrl=
true
